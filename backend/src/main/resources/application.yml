spring:
  application:
    name: health-diet-backend
  datasource:
    # 默认仍连开发库 health_diet，保证本地直接启动不变。
    # 跑自动化测试时用环境变量指向独立测试库：
    #   set DB_NAME=health_diet_test
    #   cd backend && mvnw spring-boot:run
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:health_diet}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.health.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:

    address: 0.0.0.0
    context-path: /api

jwt:
  secret: health_diet_secret_key_2024_secure_enough_for_hs256_algorithm_with_sufficient_length
  expire: 86400
  header: Authorization

algorithm:
  base-url: http://localhost:5000/api

# ============ CORS配置 ============
# cpolar部署时：把下面这行的域名替换为你的cpolar URL，多个用逗号分隔
# 或者设置 cors.allow-all-origins=true 允许所有来源（不推荐长期使用）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175}
  allow-all-origins: ${CORS_ALLOW_ALL:false}

deepseek:
  # 密钥从环境变量读取，不要写进代码（本仓库是公开的，写进来就等于公开泄露）
  # 设置方法（PowerShell，设置后需重开 IDE / 终端才生效）：
  #   [Environment]::SetEnvironmentVariable('DEEPSEEK_API_KEY','你的key','User')
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
