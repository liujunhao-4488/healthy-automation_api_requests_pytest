spring:
  application:
    name: health-diet-backend
  datasource:
    url: jdbc:mysql://localhost:3306/health_diet?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.health.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: health_diet_secret_key_2024_secure_enough_for_hs256_algorithm_with_sufficient_length
  expire: 86400
  header: Authorization

algorithm:
  base-url: http://localhost:5000/api
