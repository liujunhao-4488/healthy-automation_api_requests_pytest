# Maven Wrapper 配置
#
# 为什么加这个文件：
#   项目原来假设"你机器上装了 Maven"。换台机器、或者像现在这样
#   没装 Maven 只装了 JDK，就构建不了 —— 而这恰恰是别人拿到仓库后
#   要做的第一件事。有了 mvnw，只要机器上有 JDK，Maven 由脚本自己下。
#
# 首次执行 ./mvnw（Windows 下 mvnw.cmd）时，会把 Maven 3.9.9 下载到
# ~/.m2/wrapper/dists/ 下，之后复用，不再联网。

# 要用的 Maven 版本。改这里 = 升级整个团队/CI 的 Maven 版本。
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip

# 下载后校验，防止拿到损坏或被篡改的包（校验失败会直接报错中断）。
distributionSha256Sum=4ec3f26fb1a692473aea0235c300bd20f0f9fe741947c82c1234cefd76ac3a3c

# 兜底：万一 .mvn/wrapper/maven-wrapper.jar 被删了（比如被误加进 .gitignore），
# 脚本会按这个地址把它下回来。
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
