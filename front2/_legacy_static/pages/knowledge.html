.k-feature-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--green-100)}
.k-feature-meta span{display:inline-flex;align-items:center;gap:5px}

.k-filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 20px}

.k-note{font-size:11.5px;line-height:1.75;color:var(--text-3);margin-top:10px}
.k-skeleton{display:flex;gap:20px;padding:16px}
.k-skeleton .sk-thumb{width:190px;flex:none;aspect-ratio:4/3;border-radius:12px}
.k-skeleton .sk-body{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:4px}
@media (max-width:720px){.k-skeleton .sk-thumb{width:96px}}
</style>

<main class="app-content">

    <header class="page-head reveal">

        <button class="chip" type="button" data-cat="增肌指南">增肌指南</button>
        <button class="chip" type="button" data-cat="饮食误区">饮食误区</button>
      </div>
    </section>

    <section class="grid split reveal d3">
      <div>
        <div class="k-list" id="articleList"></div>
        <div class="k-pager" id="pager" hidden></div>
      </div>

      <aside class="col" style="gap:20px">
        <article class="card card-pad">
          <div class="row-between">
            <p class="eyebrow" style="margin:0">Trending · 热门</p>
            <span class="small muted">按阅读量</span>
          </div>
          <div class="mt-12" id="hotList"></div>
        </article>

        <article class="card card-pad">
          <p class="eyebrow" style="margin:0">Tags · 标签云</p>
          <div class="k-tagcloud" id="tagCloud"></div>
          <p class="k-note">点击标签会填入搜索框并筛选相关文章。</p>
        </article>

        <article class="card card-pad">
          <div class="alert-inline">
            <i class="ic" data-ic="info"></i>
            <div>
              <strong style="display:block;margin-bottom:3px">内容不替代医疗诊断</strong>
              文章为通用营养科普，慢病管理与用药请遵医嘱，必要时咨询临床营养师。

          </div>

      </aside>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/store.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  const UI = window.UI, API = window.API, Store = window.Store, DB = window.DB;
  const listEl = document.getElementById('articleList');
  const pagerEl = document.getElementById('pager');
  const kwInput = document.getElementById('keywordInput');
  const catChips = document.getElementById('catChips');
  const state = { cat: '全部', keyword: '', tag: '', page: 1 };
  let seq = 0, timer = null;

  /* ---------- 精选 ---------- */
  const feat = DB.articles.find(function (a) { return a.id === 2; }) || DB.articles[0];
  const featureWrap = document.getElementById('featureWrap');
  featureWrap.innerHTML =
    '<div class="feature-article">' +
      '<img src="' + feat.cover + '" alt="' + UI.esc(feat.title) + '">' +
      '<div class="inner">' +
        '<span class="badge">' + UI.esc(feat.cat) + '</span>' +
        '<h2 class="mt-12"><a href="article-detail.html?id=' + feat.id + '" style="color:inherit;text-decoration:none">' + UI.esc(feat.title) + '</a></h2>' +
        '<p class="small" style="color:var(--green-100);margin-top:10px;max-width:560px;line-height:1.8">' + UI.esc(feat.summary) + '</p>' +
        '<div class="k-feature-meta">' +
          '<span><i class="ic" data-ic="user"></i>' + UI.esc(feat.author) + '</span>' +
          '<span><i class="ic" data-ic="calendar"></i>' + Store.dateLabel(feat.date) + '</span>' +
          '<span><i class="ic" data-ic="eye"></i>' + UI.num(feat.views) + ' 阅读</span>' +
        '</div>' +
        '<a class="btn btn-outline btn-sm mt-16" href="article-detail.html?id=' + feat.id + '">阅读全文 <i class="ic" data-ic="arrow-right"></i></a>' +
      '</div>' +
    '</div>';
  Icons.hydrate(featureWrap);

  /* ---------- 热门 / 标签 ---------- */
  const hot = DB.articles.slice().sort(function (a, b) { return b.views - a.views; }).slice(0, 5);
  document.getElementById('hotList').innerHTML = hot.map(function (a, i) {
    return '<a class="rank-row" href="article-detail.html?id=' + a.id + '" style="text-decoration:none">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="rank-name">' + UI.esc(a.title) + '</span>' +
      '<span class="rank-val">' + UI.num(a.views) + '</span></a>';
  }).join('');
  Icons.hydrate(document.getElementById('hotList'));

  const tagCount = {};
  DB.articles.forEach(function (a) {
    a.tags.forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  const tags = Object.keys(tagCount).sort(function (a, b) {
    return tagCount[b] - tagCount[a] || a.localeCompare(b, 'zh');
  }).slice(0, 12);
  const tagCloud = document.getElementById('tagCloud');
  tagCloud.innerHTML = tags.map(function (t) {
    return '<button class="chip" type="button" data-tag="' + UI.esc(t) + '" style="height:28px;padding:0 11px;font-size:11.5px">' +
      UI.esc(t) + ' <span class="num" style="color:var(--text-3);font-size:10px">' + tagCount[t] + '</span></button>';
  }).join('');
  Icons.hydrate(tagCloud);

  tagCloud.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-tag]');
    if (!btn) return;
    state.tag = btn.dataset.tag;
    state.keyword = '';
    state.cat = '全部';
    state.page = 1;
    kwInput.value = state.tag;
    setChips();
    load();
  });

  /* ---------- 分类 ---------- */
  function setChips() {
    catChips.querySelectorAll('[data-cat]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.cat === state.cat);
    });
  }
  catChips.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    state.cat = btn.dataset.cat;
    state.page = 1;
    setChips();
    load();
  });

  /* ---------- 搜索（300ms 防抖） ---------- */
  kwInput.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.keyword = kwInput.value.trim();
      state.tag = '';
      state.page = 1;
      load();
    }, 300);
  });

  pagerEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-go]');
    if (!btn || btn.disabled) return;
    state.page += btn.dataset.go === 'next' ? 1 : -1;
    load();
    window.scrollTo({ top: Math.max(0, listEl.getBoundingClientRect().top + window.pageYOffset - 90), behavior: 'smooth' });
  });

  listEl.addEventListener('click', function (e) {
    const card = e.target.closest('.article-card');
    if (!card || e.target.closest('a')) return;
    location.href = card.dataset.href;
  });

  /* ---------- 列表 ---------- */
  function skeleton() {
    let html = '';
    for (let i = 0; i < 3; i++) {
      html += '<div class="card k-skeleton">' +
        '<div class="sk sk-thumb"></div>' +
        '<div class="sk-body"><div class="sk" style="height:18px;width:62%"></div>' +
        '<div class="sk" style="height:12px;width:96%"></div>' +
        '<div class="sk" style="height:12px;width:86%"></div>' +
        '<div class="sk" style="height:12px;width:44%;margin-top:6px"></div></div></div>';
    }
    return html;
  }

  function cardHtml(a) {
    return '<article class="card article-card" data-href="article-detail.html?id=' + a.id + '" style="cursor:pointer">' +
      '<a class="thumb" href="article-detail.html?id=' + a.id + '" style="display:block">' +
        '<img src="' + a.cover + '" alt="' + UI.esc(a.title) + '">' +
      '</a>' +
      '<div class="body">' +
        '<div class="row wrap" style="gap:8px">' +
          '<span class="badge gray">' + UI.esc(a.cat) + '</span>' +
          a.tags.slice(0, 2).map(function (t) { return '<span class="tag">' + UI.esc(t) + '</span>'; }).join('') +
        '</div>' +
        '<h3><a href="article-detail.html?id=' + a.id + '" style="text-decoration:none;color:inherit">' + UI.esc(a.title) + '</a></h3>' +
        '<p class="excerpt">' + UI.esc(a.summary) + '</p>' +
        '<div class="article-meta">' +
          '<span class="a-meta-item"><i class="ic" data-ic="user"></i>' + UI.esc(a.author) + '</span>' +
          '<span class="a-meta-item"><i class="ic" data-ic="calendar"></i>' + Store.dateLabel(a.date) + '</span>' +
          '<span class="a-meta-item"><i class="ic" data-ic="eye"></i>' + UI.num(a.views) + '</span>' +
          '<span class="a-meta-item"><i class="ic" data-ic="thumbs-up"></i>' + UI.num(a.likes) + '</span>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  async function load() {
    const mine = ++seq;
    pagerEl.hidden = true;
    listEl.innerHTML = skeleton();
    const res = await API.articles.list({
      cat: state.cat, keyword: state.keyword, tag: state.tag,
      page: state.page, pageSize: 5
    });
    if (mine !== seq) return;

    if (res.code !== 200) {
      listEl.innerHTML = '<div class="card">' + UI.empty('加载失败', res.message, 'alert') + '</div>';
      Icons.hydrate(listEl);
      return;
    }

    const d = res.data;
    if (!d.list.length) {
      listEl.innerHTML = '<div class="card">' + UI.empty('没有找到相关文章', '试试更换分类、清空搜索词，或点击标签云里的其他标签。', 'news') + '</div>';
      Icons.hydrate(listEl);
      return;
    }

    listEl.innerHTML = d.list.map(cardHtml).join('');
    Icons.hydrate(listEl);

    const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
    pagerEl.hidden = false;
    pagerEl.innerHTML =
      '<button class="btn btn-outline btn-sm" data-go="prev"' + (state.page <= 1 ? ' disabled' : '') + '>上一页</button>' +
      '<span class="small muted">第 ' + d.page + ' / ' + pages + ' 页 · 共 ' + d.total + ' 篇</span>' +
      '<button class="btn btn-outline btn-sm" data-go="next"' + (state.page >= pages ? ' disabled' : '') + '>下一页</button>';
  }

  load();
})();
</script>
</body>
