<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>膳衡 · 登录 | 个人健康饮食推荐</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="app" data-page="login">

<main class="app-content">
  <div class="auth">
    <section class="auth-visual">
      <img src="assets/hero-food.jpg" alt="新鲜食材平铺摄影">
      <div class="auth-visual-inner">
        <div class="auth-brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c0 9-5 14-12 14H5c0-9 5-14 12-14h3Z"/><path d="M5 21c1-6 4-9 9-12"/></svg>
          </span>
          <span>
            <strong>膳衡</strong>
            <small>SHANHENG · 健康饮食</small>
          </span>
        </div>

        <div class="auth-quote">
          <h2>把「吃得健康」<br>变成每天可执行的三餐。</h2>
          <p>建立健康档案，设定饮食目标，记录每一餐，让 AI 结合权威食养指南给你可追溯的建议。</p>
          <div class="auth-tags mt-24">
            <span>AI 个性化推荐</span>
            <span>营养量化记录</span>
            <span>权威食养指南 RAG</span>
          </div>
        </div>

        <p class="small" style="color:#a9c3b4">本系统仅提供饮食与营养建议，不替代医疗诊断与医嘱。</p>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-box">
        <p class="eyebrow">Welcome back</p>
        <h1>今天，好好吃饭</h1>
        <p class="sub">登录后继续记录你的饮食与目标进度。</p>

        <div class="auth-tabs">
          <button class="auth-tab on" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>

        <!-- 登录 -->
        <form class="auth-form on" id="loginForm" novalidate>
          <label class="field">
            <span class="field-label">邮箱</span>
            <input class="input" type="email" id="loginEmail" value="jiahe@example.com" placeholder="you@example.com" autocomplete="email">
            <span class="field-error" id="loginEmailErr">请输入有效的邮箱地址</span>
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input class="input" type="password" id="loginPassword" value="123456" placeholder="6–50 位" autocomplete="current-password">
            <span class="field-error" id="loginPwdErr">密码至少 6 位</span>
          </label>
          <div class="row-between">
            <label class="switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="switch-text">记住我</span>
            </label>
            <button type="button" class="link-btn" id="forgotBtn">忘记密码？</button>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginSubmit">登录</button>

          <div class="auth-divider">或</div>
          <button class="btn btn-outline btn-block" type="button" id="demoBtn">
            <i class="ic" data-ic="play"></i> 使用体验账号快速进入
          </button>

          <div class="auth-note">
            体验账号：<b>jiahe@example.com</b> / <b>123456</b>（管理员角色，可查看管理后台）。<br>
            演示用的所有数据均为本地假数据，不会上传。
          </div>
        </form>

        <!-- 注册 -->
        <form class="auth-form" id="registerForm" novalidate>
          <label class="field">
            <span class="field-label">用户名</span>
            <input class="input" type="text" id="regName" placeholder="2–20 个字符">
            <span class="field-error" id="regNameErr">请输入用户名</span>
          </label>
          <label class="field">
            <span class="field-label">邮箱</span>
            <input class="input" type="email" id="regEmail" placeholder="you@example.com">
            <span class="field-error" id="regEmailErr">请输入有效的邮箱地址</span>
          </label>
          <label class="field">
            <span class="field-label">手机号</span>
            <input class="input" type="tel" id="regPhone" placeholder="选填，用于接收饮食提醒">
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input class="input" type="password" id="regPassword" placeholder="6–50 位">
            <span class="field-error" id="regPwdErr">密码长度需在 6–50 位之间</span>
          </label>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="registerSubmit">创建账号</button>
          <p class="small muted" style="text-align:center">注册即表示同意《用户协议》与《隐私政策》。</p>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/mock.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const UI = window.UI, API = window.API, Store = window.Store;

  // Tab 切换
  UI.$$('.auth-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      UI.$$('.auth-tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
      const isLogin = tab.dataset.tab === 'login';
      document.getElementById('loginForm').classList.toggle('on', isLogin);
      document.getElementById('registerForm').classList.toggle('on', !isLogin);
    });
  });

  function fail(fieldId, errId) {
    document.getElementById(fieldId).closest('.field').classList.add('has-error');
    if (errId) document.getElementById(errId).style.display = 'block';
  }
  function clearErrors(form) {
    form.querySelectorAll('.field').forEach(f => f.classList.remove('has-error'));
    form.querySelectorAll('.field-error').forEach(e => e.style.display = 'none');
  }

  // 登录
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors(this);
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail('loginEmail', 'loginEmailErr'); return; }
    if (password.length < 6) { fail('loginPassword', 'loginPwdErr'); return; }

    const btn = document.getElementById('loginSubmit');
    UI.loading(btn, true, '登录中');
    const res = await API.auth.login({ email, password });
    UI.loading(btn, false);
    if (res.code !== 200) { UI.toast(res.message, 'error'); return; }
    Store.login(email, password);
    UI.toast('登录成功，正在进入工作台');
    setTimeout(function () { location.href = 'pages/home.html'; }, 320);
  });

  // 体验账号
  document.getElementById('demoBtn').addEventListener('click', function () {
    Store.login('jiahe@example.com', '123456');
    UI.toast('已进入体验账号');
    setTimeout(function () { location.href = 'pages/home.html'; }, 300);
  });

  // 注册
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors(this);
    const username = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!username) { fail('regName', 'regNameErr'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail('regEmail', 'regEmailErr'); return; }
    if (password.length < 6 || password.length > 50) { fail('regPassword', 'regPwdErr'); return; }

    const btn = document.getElementById('registerSubmit');
    UI.loading(btn, true, '创建中');
    const res = await API.auth.register({ username, email, phone, password });
    UI.loading(btn, false);
    if (res.code !== 200) { UI.toast(res.message, 'error'); return; }
    Store.login(email, password);
    UI.toast('注册成功，正在进入健康引导');
    setTimeout(function () { location.href = 'pages/health.html'; }, 320);
  });

  document.getElementById('forgotBtn').addEventListener('click', function () {
    UI.toast('演示环境暂未接入邮件服务，请使用体验账号登录');
  });
})();
</script>
</body>
</html>
