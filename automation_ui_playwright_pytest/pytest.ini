[pytest]
# UI 自动化的 pytest 配置。
# 和接口层 automation_api_requests_pytest/pytest.ini 刻意不共用一份：
#   两边用例数、耗时、标记语义都不同（接口 200+ 条跑 3 分钟，UI 十几条跑 5 分钟），
#   混在一份配置里，"一次跑多少"就没法按层控制。

testpaths = test_cases
# 让用例能直接 `from pages.login_page import LoginPage`
pythonpath = .

addopts = --strict-markers
# 参数化里的中文 id 原样显示，不转成 \u767b\u5f55
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# ---- 分层标记 ----
# 由 conftest.py 的 pytest_itemcollected 自动挂（按目录/文件名推），用例文件里不用写装饰器。
# 只有"要覆盖默认分层"时才显式写，比如登录链路要用 ui_form_login 标一下。
markers =
    smoke: 冒烟（登录链路 + 档案读取，不调模型，目标 2 分钟内跑完）
    regression: 全量（所有 UI 用例）
    weekly: 每周回归集合（全量 + 慢链路，CI / 计划任务跑这个）
    ui_form_login: 真走登录表单的用例（不直注 token，专门守登录链路本身）
    needs_profile: 依赖测试库里存在完整健康档案的用例
    slow_ai: 依赖大模型回复的用例（慢、有波动，不进 smoke）

# ---- 重试 ----
# 只重跑"浏览器/网络抖动"，断言失败不重跑。
# UI 层比接口层更容易碰上偶发：元素刚好在动画里、Vite 热更新重载、后端重启。
# 但只给 1 次 —— 重跑失败率高的用例，说明它本身不稳，重试只是在掩盖问题。
reruns = 1
reruns_delay = 2
only_rerun =
    TimeoutError
    Target closed
    Target page, context or browser has been closed
    net::ERR_CONNECTION_REFUSED
    net::ERR_ABORTED

# ---- 单用例超时 ----
# UI 用例的正常耗时是 3~20s（含一次登录 / 一次页面导航 / AI 回复）。
# 300s 是"卡死了"的门槛，不是性能指标。
# ⚠️ Windows 上 pytest-timeout 退化为 thread 模式，超时会终止整场而非只中断当前用例
#    （接口层的 pytest.ini 里有同样的说明）—— 跑在 Linux/CI 上才有单条隔离。
timeout = 300

# ---- 日志 ----
log_level = INFO
log_format = %(asctime)s %(levelname).1s %(message)s
log_date_format = %H:%M:%S
