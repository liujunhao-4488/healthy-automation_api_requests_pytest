[pytest]
# 只跑 test_cases 目录下的测试
testpaths = test_cases
# 允许测试文件直接 `from config import ...`（把项目根目录加入 Python 搜索路径）
pythonpath = .
# 显示每个用例的打印内容，失败时更好排查
addopts = -s
# 让参数化用例的中文名原样显示（默认会被转义成 \u6b63\u5e38... 这种，没法看）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# ---- 日志：让 common/db.py 的 SQL 日志在跑测试时直接打出来 ----
# log_cli = true 表示"边跑边显示"，不需要额外加 --log-cli-level
log_cli = true
log_cli_level = INFO
# I/W 开头的单字母级别 + 模块名 + 正文，一行看完
log_cli_format = %(levelname).1s | %(name)-6s | %(message)s
