[pytest]
# 只跑 test_cases 目录下的测试
testpaths = test_cases
# 允许测试文件直接 `from config import ...`（把项目根目录加入 Python 搜索路径）
pythonpath = .
# 不再放开 -s：用例里的 print 被 pytest 捕获，只在该用例失败时出现在失败详情里。
# 控制台输出由 conftest.py 的"用例分块"钩子统一接管。
#
# ⚠️ Allure 的报告参数（--alluredir / --clean-alluredir）**故意不写在这里**：
#    ① 相对路径按"当前工作目录"解析，在 PyCharm 里换个工作目录就写到别处去了；
#    ② 没装 allure-pytest 的机器上，addopts 里的 --alluredir 会让 pytest
#       直接报 unrecognized arguments —— 全场用例一条都跑不起来。
#    默认结果目录由 conftest.py 的 pytest_configure 按 rootdir 算出绝对路径再塞回去，
#    详见那里的注释（以及 common/allure_helper.py 的 results_dir）。
#    想临时换个目录：pytest test_cases --alluredir=D:\somewhere\results
addopts = --strict-markers
# 让参数化用例的中文名原样显示（默认会被转义成 \u6b63\u5e38... 这种，没法看）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# ---- 用例标记 ----
# requires_db：本条用例会直接连 MySQL（对账/清理）。
#   默认 AUTOTEST_REQUIRE_DB=1，全套要求测试库存在；
#   设 AUTOTEST_REQUIRE_DB=0 时，这些用例自动 skip，纯接口用例仍可跑。
#
# 分层标记由 conftest.py 的 pytest_itemcollected 在收集阶段自动挂，
# 用例文件里不用写装饰器；--strict-markers 保证写错的标记直接报错。
markers =
    requires_db: 用例直接访问 MySQL，数据库不可用时应跳过
    smoke: 核心链路快速回归（auth / health / user / toolbox，不调模型，目标 1 分钟内）
    regression: 全量回归（所有用例）
    p0: 阻断级（核心业务 + 确定性安全拦截）
    p1: 扩展级（AI 助手行为用例，依赖模型）

# ---- 重试：只重跑网络类失败 ----
# 不是"失败就重跑"：only_rerun 里的正则命中失败文本才重试，
# 断言失败 / 业务码不符 / 用例 bug 一律不重跑 —— 那些重跑多少次都不会变绿。
# 后端/Flask 没起由环境预检直接中止，不会走到这里。
reruns = 2
reruns_delay = 1
only_rerun =
    ConnectionError
    ReadTimeout
    ConnectTimeout
    requests.exceptions.Timeout
    Max retries exceeded
    Connection reset

# ---- 单用例超时 ----
# 防止某条请求卡死拖住整场；超时按"整条用例（setup + call + teardown）"算。
# 不写 timeout_method：Unix 默认 signal（能只中断当前用例），
# Windows 自动退化为 thread（杀不掉线程，超时会 dump 栈并终止整场 ——
# 至少不会永久挂住；要“单条独立失败”请到 Linux/CI 上跑）。
timeout = 180

# ---- 并行 ----
# xdist 已安装，但**不默认开**：AI 评测留痕是进程内内存，worker 之间无法合并；
# 需要并行时显式加 -n（建议 4 个 + loadscope，让同模块用例落在同一个 worker）：
#   pytest -n 4 --dist=loadscope

# ---- 日志（失败时的捕获区） ----
# 控制台不再实时刷日志（log_cli 关掉，由分块钩子接管）；
# 但用例运行期间的日志会被 pytest 捕获，失败时整段打印在 "Captured log" 里。
# log_level=INFO 保证单行请求、QA 记录、完整响应体都能被捕获到。
log_level = INFO
log_format = %(asctime)s %(levelname).1s %(message)s
log_date_format = %H:%M:%S
