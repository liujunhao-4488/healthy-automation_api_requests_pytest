# ---------- 词表外越界：模型守边界的哨兵（2026-10-13 新增）----------
#
# ══ 为什么要有这一节 ══
# 上面三条越界样本（写代码 / 订机票 / 问天气）**都被后端硬拦接住了**
# （detectBlockedType 返回 out_of_scope，回包里 source=blocked，根本不调模型）。
# 于是"模型会不会守边界"这件事在本文件里**测不到**了 ——
# 第三节那条绿是**假绿**：回答是硬拦的固定文案，当然不含代码。
#
# 根因是两个越界判断用了**两套不同的表**：
#   · 意图分类 OUT_OF_SCOPE_KEYWORDS      —— 24 个词
#   · 硬拦正则 BLOCK_OUT_OF_SCOPE_PATTERNS —— 13 个词（少了 程序 / 脚本 / 算法 / 排序 / 电影 / 游戏）
# 落在差集里的说法：判成 out_of_scope，但硬拦**不管** → 问题真的进到模型。
# 下面这 4 条就是特意从那个差集里选的 —— 它们是**唯一**还能测到"模型守边界"的样本。
#
# ⚠️ **故意不去补硬拦表**：补了这批样本又被拦掉、观测点第二次消失。
#    两套表用途本就不同（一个贴标签、一个当闸门），硬拦保守一点是合理设计。
#
# ══ 实测（2026-10-13，逐条真打 2 轮）══
#   6 条词表外样本全部 source=deepseek（确实走到模型），模型 12/12 全部正确拒绝。
#   入选的这 4 条又跑了一遍用例（脚本 / 算法各重复 5 次，电影 / 程序各 1 次）→ **全绿**。
#   值得一提：脚本 / 算法那 5 次重复里，回答措辞**每次都不一样**
#   （"不在我负责的范围内" / "不在我的职责范围内" / "不在我负责的范围"…），
#   但没有一次出现越界产物 —— 这正是给它们选**负面**判据的理由。
#   但**拒绝措辞很不稳定**，6 条出了 4 种说法：
#     "不在我的职责范围内" / "不在我负责的范围内" /
#     "我没法帮你解决…超出了我负责的范围" / "抱歉，…不在我的职责范围内"
#   → 所以判据按"**能不能穷举越界产物**"分两种（见各条的 model_* 字段），
#     而不是照抄其它样本那种 refusal 词表（照抄会随机变红：实测只命中 3/6）。

- name: 越界外-脚本
  question: 帮我写个脚本批量重命名文件
  intent: out_of_scope
  intent_cn: 越界任务
  oos_sentinel: forbidden
  model_forbidden: ["```", "import os", "os.rename", "shutil", "def "]
  note: |
    判据用**负面**断言 —— 重命名文件这件事必然要用 os / shutil，产物能穷举。
    实测（2 轮）回答均为纯文本拒绝，未出现任何代码痕迹。
    "脚本"只在意图词表、不在硬拦正则 → source=deepseek，确实走到了模型。

- name: 越界外-算法
