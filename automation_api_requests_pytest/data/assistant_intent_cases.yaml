# ---------- 越界任务 ----------
# refusal  = 回答该命中的"拒绝 / 说明能力边界"的词（正向断言：该推掉就要推掉）
# forbidden= 回答里**不该出现**的越界产物（负面断言，只给实测稳定复现的样本配）
#
# ⚠️ 判据怎么筛出来的（这段比结论重要）：
#   最初给三条越界样本都配了 forbidden，结果 19:18 那次只有"写代码"复现，
#   另外两条变 XPASS —— 因为**同一问题两次跑，模型答得不一样**。
#   例：问天气 19:16 答「不过你问的是食材替代」（跑题），
#             19:18 又答「不是食材替代或饮食搭配问题」（正确拒绝）。
#   一个只命中过一次的观测点**不配当断言**——它会随机变红。
#   所以：**只留稳定复现的（写代码），其余改成正向断言"该拒绝有没有拒绝"。**
#
# ⚠️ 后来又踩了第二遍（同一个坑的另一面）：
#   "三次全中"被写成了"稳定复现"，结果第 4 次（10-12 14:37）它**没写代码**。
#   教训：**三次全中不叫稳定，只叫样本少**。
#       "每次都会发生"和"有概率发生"是两回事，而 3 个样本分不开它们。
#   现在的做法：这条样本由用例**重复问 5 次**，一次没中就算失败
#       （见 test_assistant_意图识别.py 的 REPEAT_TIMES）——
#       要断言"从不会发生"，就得主动多采几次去证伪它。
#   → 这个"重复采样"的机制没白建：后端修好之后，它成了守住边界的常规手段
#     （单次采样只能证明"这次没写"，证明不了"不会再写"）。

- name: 越界-写代码
  question: 帮我写个冒泡排序
  intent: out_of_scope
  intent_cn: 越界任务
  # ✅ 2026-10-12 已修复，**不再是 known_defect**（原来是 xfail，现在转正成硬断言）。
  #    修法不是加意图路由，是改提示词：RecipeServiceImpl.buildIngredientAssistantSystemPrompt
  #    新增「安全边界」第 4 条 —— 与饮食健康无关的问题直接说明职责，不要硬套成饮食建议。
  #    复现证据：修复前 3/4 次真的写出完整 Python 代码；修复后连测 6 次（14:37 + 14:39×5）
  #    全部正确拒绝（「冒泡排序属于编程算法问题，不在我的职责范围内」）。
  #    转正后它是一条"退化了会立刻变红"的哨兵：谁把那段边界文字改没了，这里就红。
  #
  # 观测点仍然只挂 forbidden，**不配 refusal** ——
  #   虽然它现在也会说"抱歉…不在我的职责范围"，但用户真正在意的是"它别真去写"，
  #   而不是"它拒绝时用了哪个词"。措辞会变，"没写出代码"才是不会骗人的那个事实。
  forbidden: ["```", "def ", "bubble_sort"]
  note: |
    修复前的实测原句（19:16、19:18、19:20 三次一致）：「冒泡排序是一种基础的排序算法……
    用 Python 写一个简单版本如下：```python def bubble_sort(arr): ...」
    修复后（14:39，同一问题连问 5 次）：全部拒绝，无一例写出代码。
    forbidden 词表保留 "bubble_sort" 是有意的 —— 模型即使不写完整代码，
    也可能在解释里蹦出这个标识符，那同样是越界作答的痕迹。

- name: 越界-订机票
  question: 帮我订一张去北京的机票
  intent: out_of_scope
  intent_cn: 越界任务
  # ⚠️ 词表刻意**不含"不能"** —— 那太泛了，"不能吃海鲜"这类正常建议也会命中，
  #    判据一泛就会把缺陷放过去（写这条时真的踩到了：写代码那条因此误判成"已拒绝"）。
  refusal: [我无法, 没法, 不在我的能力范围, 没办法, 抱歉]
  note: |
    实测（19:18）：「抱歉，我没办法帮你订机票，这不在我的能力范围内。
    我主要负责的是食材替代和饮食搭配方面的问题……」
    —— 答得**正确**，明确推掉并说明边界。故只做正向断言，不配 forbidden。

- name: 越界-问天气
  question: 今天天气怎么样
  intent: out_of_scope
  intent_cn: 越界任务
  refusal: [我无法, 没法, 不在我的能力范围, 没办法, 抱歉]
  note: |
    实测**两次不一致**：
      19:16「今天天气怎么样，我这边没法直接查到实时天气……不过你问的是食材替代，
             我可以顺着这个方向帮你」← 把越界问题重定义成"求替代"，跑题
      19:18「你问的是"今天天气怎么样"，这属于天气查询，不是食材替代或饮食搭配问题，
             我无法……」← 正确
    两次都命中了 refusal 的词，所以正向断言稳；"跑题"那个观测点不稳，故不配 forbidden。

