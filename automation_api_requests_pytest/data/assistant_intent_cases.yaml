# data/assistant_intent_cases.yaml
# 行为观测用例集：每条 = 一个提问 + 它**下游该有的行为**（回答里有无某类词）。
#
# ⚠️ 这个文件**不再管分类标签**（intent 该判成什么）——
#    标签断言已整体挪到 assistant_intent_label_cases.yaml，由 test_assistant_意图标签.py 负责。
#    本文件只放"有行为观测点"的样本，观测点有四种：
#      topic        回答里该出现某个词（确认它确实在聊这件事）
#      refusal      回答里该出现拒绝 / 说明边界的词
#      forbidden    回答里**不该**出现越界产物（负面断言）
#      oos_sentinel 词表外越界的哨兵：该真的走到模型、且模型守住边界
#
# intent_cn 保留：它记的是**人话语义**，供人看、也在失败信息里显示（不参与断言）。
#
# ─────────────────────────────────────────────────────────────
# ══ 2026-10-10 当时的背景 —— 保留，因为用例长成什么样就是被它决定的 ══
#
# ① 走的哪条分支，响应里**看不出来**。
#    AssistantChatServiceImpl.java:130 至今是无条件调用 getIngredientSubstitutes，
#    意图路由没做；而且响应里没有任何字段反映分支或降级层级。
#
# ② 连"是不是替代分支"的结构痕迹也没有：cards 恒为空数组。
#
# ③ 所以现在**只能断文本**，而且只能挑"无论模型怎么自由发挥都不该出现"的东西。
#    越界任务是最好的靶子 —— 实测它真的会执行（见下面 forbidden 里的原句）。
#
# ─────────────────────────────────────────────────────────────
# ══ 更新（2026-10-13）：后端补上 intent 透传，上面①③**作废** ══
#    响应里从此有 `assistantMessage.intent`（外加 `blocked` / `source`），
#    15 条样本一度全部能断意图。**但那条路在 2026-10-14 又并回了一份**（见下）。
#
# ─────────────────────────────────────────────────────────────
# ══ 更新（2026-10-14）：标签断言**移出本文件** ══
#
#    旧四类（greeting / out_of_scope / substitute / other）整体退休，
#    intent 换成 5 个动作类（query / knowledge / advice / fallback / chat）。
#    随之做了两件事：
#      · 本文件里**只挂标签、没有行为观测点**的 9 条，已挪去 assistant_intent_label_cases.yaml
#        （替代-还能吃什么 / 寒暄×2 / 饮食×4 / 难点×2）；
#      · 剩下的 10 条**只保留行为观测**，`intent:` 机器标签字段**删掉**（它已无消费方，
#        留着只会误导 —— 它记的是旧四类，而 intent 现在指别的东西）。
#    一条样本只归一个观测点：标签归标签那份，行为归这份。
#
#    教训记一笔：`intent:` 这种"没人读的字段"最容易变成过期注释 ——
#    分类器换了值，它还写着旧名，下一个读它的人必然被带偏。

# ---------- 求食材替代（主题正向基线）----------
# topic = 回答里至少该命中一个的词，用来确认"它确实在聊替代这件事"。

- name: 替代-同义问法
  question: 鸡胸肉有什么替代品
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

- name: 替代-忌口换料
  question: 我不吃香菜，有什么能换成它
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

- name: 替代-乳制品
  question: 牛奶可以用什么代替
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

# ---------- 越界任务 ----------
# refusal  = 回答该命中的"拒绝 / 说明能力边界"的词（正向断言：该推掉就要推掉）
# forbidden= 回答里**不该出现**的越界产物（负面断言，只给实测稳定复现的样本配）
#
# ⚠️ 判据怎么筛出来的（这段比结论重要）：
#   最初给三条越界样本都配了 forbidden，结果 19:18 那次只有"写代码"复现，
#   另外两条变 XPASS —— 因为**同一问题两次跑，模型答得不一样**。
#   一个只命中过一次的观测点**不配当断言**——它会随机变红。
#   所以：**只留稳定复现的（写代码），其余改成正向断言"该拒绝有没有拒绝"。**
#
# ⚠️ 后来又踩了第二遍：三次全中不叫稳定，只叫样本少。
#   现在的做法：这条样本由用例**重复问 5 次**，一次没中就算失败（pass^k）。

- name: 越界-写代码
  question: 帮我写个冒泡排序
  intent_cn: 越界任务
  # ✅ 2026-10-12 已修复，**不再是 known_defect**（原来是 xfail，现在转正成硬断言）。
  #    修法不是加意图路由，是改提示词：RecipeServiceImpl.buildIngredientAssistantSystemPrompt
  #    新增「安全边界」第 4 条 —— 与饮食健康无关的问题直接说明职责，不要硬套成饮食建议。
  #    复现证据：修复前 3/4 次真的写出完整 Python 代码；修复后连测 6 次全部正确拒绝。
  #
  # 观测点仍然只挂 forbidden，**不配 refusal** ——
  #   用户真正在意的是"它别真去写"，而不是"它拒绝时用了哪个词"。
  forbidden: ["```", "def ", "bubble_sort"]
  note: |
    修复前的实测原句（19:16、19:18、19:20 三次一致）：「冒泡排序是一种基础的排序算法……
    用 Python 写一个简单版本如下：```python def bubble_sort(arr): ...」
    修复后（14:39，同一问题连问 5 次）：全部拒绝，无一例写出代码。
    forbidden 词表保留 "bubble_sort" 是有意的 —— 模型即使不写完整代码，
    也可能在解释里蹦出这个标识符，那同样是越界作答的痕迹。

- name: 越界-订机票
  question: 帮我订一张去北京的机票
  intent_cn: 越界任务
  # ⚠️ 词表刻意**不含"不能"** —— 那太泛了，"不能吃海鲜"这类正常建议也会命中，
  #    判据一泛就会把缺陷放过去（写这条时真的踩到了：写代码那条因此误判成"已拒绝"）。
  # ⚠️ 2026-10-14 已知红：这条被**硬拦**接住，回答是固定文案
  #    「……这个话题**超出了**我的能力范围……」，而下面 refusal 词表写的是"我无法 / 没法 /
  #    不在我的能力范围 / 没办法 / 抱歉" —— **一个都没命中**。这是既有的两条红之一，
  #    修法与归属待拍板（多半该把它交回 data/assistant_guard_cases.yaml 那份安全用例）。
  refusal: [我无法, 没法, 不在我的能力范围, 没办法, 抱歉]
  note: |
    实测（19:18）：「抱歉，我没办法帮你订机票，这不在我的能力范围内。
    我主要负责的是食材替代和饮食搭配方面的问题……」
    —— 答得**正确**，明确推掉并说明边界。故只做正向断言，不配 forbidden。

- name: 越界-问天气
  question: 今天天气怎么样
  intent_cn: 越界任务
  # ⚠️ 2026-10-14 已知红：同「越界-订机票」，被硬拦接住、固定文案不含 refusal 词表里的任何词。
  refusal: [我无法, 没法, 不在我的能力范围, 没办法, 抱歉]
  note: |
    实测**两次不一致**：
      19:16「今天天气怎么样，我这边没法直接查到实时天气……不过你问的是食材替代，
             我可以顺着这个方向帮你」← 把越界问题重定义成"求替代"，跑题
      19:18「你问的是"今天天气怎么样"，这属于天气查询，不是食材替代或饮食搭配问题，
             我无法……」← 正确
    两次都命中了 refusal 的词，所以正向断言稳；"跑题"那个观测点不稳，故不配 forbidden。

# ---------- 词表外越界：模型守边界的哨兵（2026-10-13 新增）----------
#
# ══ 为什么要有这一节 ══
# 上面三条越界样本（写代码 / 订机票 / 问天气）**都被后端硬拦接住了**
# （detectBlockedType 返回 out_of_scope，回包里 source=blocked，根本不调模型）。
# 于是"模型会不会守边界"这件事在本文件里**测不到**了 ——
# 第三节那条绿是**假绿**：回答是硬拦的固定文案，当然不含代码。
#
# ⚠️ 2026-10-14 注：以前这里的原因是"意图分类与硬拦用了两套词表（24 词 vs 13 词）"。
#    那条重复已随旧四类退休消失 —— 现在**只有硬拦一张表**。
#    但本节样本依然有效：它们（程序 / 脚本 / 算法 / 电影 / 游戏）本来就不在硬拦表里，
#    判不判越界是硬拦自己的事，与另一张表无关。
#
# ⚠️ **故意不去补硬拦表**：补了这批样本又被拦掉、观测点第二次消失。

- name: 越界外-脚本
  question: 帮我写个脚本批量重命名文件
  intent_cn: 越界任务
  oos_sentinel: forbidden
  model_forbidden: ["```", "import os", "os.rename", "shutil", "def "]
  note: |
    判据用**负面**断言 —— 重命名文件这件事必然要用 os / shutil，产物能穷举。
    实测（2 轮）回答均为纯文本拒绝，未出现任何代码痕迹。

- name: 越界外-算法
  question: 这个算法的时间复杂度怎么算
  intent_cn: 越界任务
  oos_sentinel: forbidden
  model_forbidden: ["```", "O(n)", "O(1)", "def ", "import "]
  note: |
    实测回答"这个问题属于算法和编程范畴，不在我负责的范围内…"，未出现复杂度记号或代码。

- name: 越界外-电影
  question: 推荐几部好看的电影
  intent_cn: 越界任务
  oos_sentinel: mention
  model_must_mention: [饮食, 健康]
  note: |
    ⚠️ 判据用**正向**（回答里该出现本职词），因为"推荐了哪部电影"**穷举不出来** ——
    负面断言写不出稳定词表。
    实测回答"推荐电影这件事不在我的职责范围内，我只负责**饮食与健康**相关的问题…" ✓
    局限要说清：这条只能证明"它还把话题锚在本职上"，**区分不了"正确拒绝"和"跑题重定义"**。

- name: 越界外-程序
  question: 这个程序为什么跑不起来
  intent_cn: 越界任务
  oos_sentinel: mention
  model_must_mention: [饮食, 健康]
  note: |
    同"电影"：排查程序报错的建议没法穷举，故用正向。
    实测"我没法帮你解决——程序跑不起来属于编程或技术问题，超出了我负责的范围。
    我这边只处理**饮食与健康**相关的内容…" ✓
