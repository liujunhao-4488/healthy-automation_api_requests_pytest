# data/assistant_intent_cases.yaml
# 意图识别（意图路由）用例集：每条 = 一个提问 + 它**真实**的意图标签。
#
# 标签对应后端的实际输出（RecipeServiceImpl.classifyIntent）：
#   substitute    求食材替代 —— 句中含替代词
#   other         兜底 —— 前三类都不中（原名 diet_qa，2026-10-13 改名，见下）
#   greeting      寒暄
#   out_of_scope  越界任务   —— 跟饮食无关，该诚实说明能力边界
#
# ⚠️ 这里写的是**系统实际会输出的值**，不是"业务语义上它该归哪类"。
#    「早餐吃什么比较抗饿」业务上当然是饮食问答，但关键词规则认不出 → 系统输出 other。
#    所以下面这类样本的 intent 一律写 other，而 intent_cn 仍写"饮食问答"——
#    两个字段各司其职：intent 供断言，intent_cn 留人话语义，别让它们互相打架。
#
# ⚠️ 标签写的是"真实意图"，不是"系统会判成什么"。两者的差就是误判。
#
# ══ 观测点 ══
#
# 【2026-10-10 当时的结论 —— 保留，因为用例长成什么样就是被它决定的】
#
# ① 走的哪条分支，响应里**看不出来**。
#    AssistantChatServiceImpl.java:130 至今是无条件调用 getIngredientSubstitutes，
#    意图路由没做；而且响应里没有任何字段反映分支或降级层级
#    （buildAssistantTextResult 算了 source，saveAssistantReply 把它丢了 —— 见迭代记录附录①）。
#
# ② 连"是不是替代分支"的结构痕迹也没有：cards 恒为空数组。
#    getIngredientSubstitutes 的三条路（DeepSeek :605 / Python 服务 / 本地兜底 :370）
#    **最后都走 buildAssistantTextResult**，而它只设 mode="text"，从不设 cards（:608-614）。
#    于是 AssistantChatServiceImpl.java:211 的 messageType == "cards" 分支根本走不到。
#    （这一条推翻了我最初"用 cards 判分支"的想法 —— 实测才知道。）
#
# ③ 所以现在**只能断文本**，而且只能挑"无论模型怎么自由发挥都不该出现"的东西。
#    越界任务是最好的靶子 —— 实测它真的会执行（见下面 forbidden 里的原句）。
#
# 结论：**只有越界类写得出硬断言；寒暄 / 饮食问答类目前无黑盒观测点**，
#      它们留在数据集里（等后端回传 intent 后即可启用），本文件暂不对它们做断言。
#
# ─────────────────────────────────────────────────────────────
# ══ 更新（2026-10-13）：上面③的结论**已作废** ══
#
#   后端补上了 intent 透传 —— RecipeServiceImpl.classifyIntent 算出意图，
#   随**每一条出口**（含被拦、含报错）一起放进返回值，
#   AssistantChatServiceImpl 再把它挂到 assistantMessage 上。
#   所以现在响应里有 `assistantMessage.intent`（外加 `blocked` / `source`）。
#
#   变化：
#     · **15 条全部能断意图了** —— 寒暄 / 饮食问答那 8 条不再是"测不了"；
#     · ①② 两条限制**没变**：cards 恒空、回答措辞不可预测，
#       所以前三节那几条断言照旧松着断（命中词表就算过）。
#
#   实测（2026-10-13，后端在跑，逐条真打）：**14/15**。
#   唯一一条误判是「替代-还能吃什么」，已用 known_defect 钉住（见该条注释）。
#   ⚠️ 留一条已知误判是**刻意的**：15/15 全绿分不清"规则真好"还是"样本太容易"。
#
# ─────────────────────────────────────────────────────────────
# ══ 更新（2026-10-13 17:2x）：兜底标签 diet_qa → **other** ══
#
#   后端 `classifyIntent` 的第④类（兜底）**改名为 other**。
#   原因只有一个：`diet_qa` 这个名字在撒谎 —— 它是"前三类都没认出来"的位置，
#   却顶着"饮食问答"的名字。于是「帮我写首诗」「明天北京限行尾号是多少」
#   这类**越界问题**也被贴上"饮食问答"（实测确实如此），标签名和事实相反。
#   改成 other 之后名副其实：**它就是"没认出来"**，不冒充任何业务类别。
#
#   ⚠️ 改名**只让标签更诚实，没让分类更准**，还带来一条代价（别指望白来）：
#      「早餐吃什么比较抗饿」这种**没有关键词的正经饮食问题**也一起落进 other 了 ——
#      以前它叫 diet_qa（名字对、但要靠猜），现在叫 other（名字诚实、信息量归零）。
#      "系统认不认得出饮食问题"这件事，一个字没变好。
#
#   对本文件的影响：原来 6 条 intent: diet_qa 的样本（4 条"饮食-*" + 2 条"难点-*"）
#      走的一直是兜底那条路，只是那条路以前叫 diet_qa —— 现在一律改写成 other。
#      **这是改标签、不是改缺陷**：它们本来就走兜底，改完断言依然全绿，
#      所以**不标 known_defect**（给它们标缺陷等于谎报）。
#      intent_cn 保留"饮食问答"不动：它记录的是**人的语义**，供人看，不参与断言。

# ---------- 求食材替代（主题正向基线）----------
# topic = 回答里至少该命中一个的词，用来确认"它确实在聊替代这件事"。

- name: 替代-同义问法
  question: 鸡胸肉有什么替代品
  intent: substitute
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

- name: 替代-还能吃什么
  question: 我还能吃点什么别的
  intent: substitute
  intent_cn: 求食材替代
  # ⚠️ 2026-10-13 实测：这条判成了 **other**（期望 substitute）——
  #    它一个替代词都不含（"什么别的"不在 SUBSTITUTE_KEYWORDS 里），落到兜底。
  #    这是**关键词规则的天然盲区**，不是实现写错了，所以用 known_defect 钉住，
  #    而不是把断言改成迁就现状（那样准确率就成了自欺欺人的 100%）。
  #    摘标记的时机：后端把"还有什么别的 / 还能吃点什么"这类说法纳入替代词表，
  #    或者换成语义判断之后 —— 届时 xfail 会变 XPASS(strict) 报红，提醒摘掉。
  #
  #    📌 原来这条还挂着一个 topic（"回答里该出现替代字眼"），本次**撤掉**了。
  #       理由是一条样本只归一个观测点：它的缺陷是"**判成了什么意图**"，
  #       就该由意图断言去盯；挂着 topic 会让同一个缺陷被算两遍。
  known_defect: 关键词规则抓不到"什么别的"这类不用替代词的说法，落到兜底判成 other

- name: 替代-忌口换料
  question: 我不吃香菜，有什么能换成它
  intent: substitute
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

- name: 替代-乳制品
  question: 牛奶可以用什么代替
  intent: substitute
  intent_cn: 求食材替代
  topic: [替代, 代替, 替换, 换成]

