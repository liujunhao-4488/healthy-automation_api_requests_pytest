# kb_golden_cases.yaml
# ======================================================================
# 知识库检索 golden set —— "测 RAG 召回"的基准
#
# 一句话：**人工标好"这个问题该命中哪篇文档的哪一节"，然后让机器去查，看对不对。**
# 它是整条 RAG 链路上唯一能给出**数字**的东西：
#   命中率 = 命中的题数 / 总题数。改切块参数、换检索算法、加语料，
#   都拿它量一次，才知道是变好还是变坏（这就是消融实验）。
#
# 顶层必须是**列表**（list[dict]）—— 这样能直接喂给 common/data_loader.load_cases()，
# 别处不用为它单独写一套读法。
#
# ══ 2026-10-18 扩容：18 → 40 条，并引入 type 分类 ══════════════════
#
#   为什么扩：原 16 条正样本里有 12 条是"信息词齐全"的书面问法，
#   等于**专挑好答的题考**。真实用户说的是"肾不好怎么吃""太胖了怎么减"——
#   这类短句在 BM25 词面匹配下参与打分的词极少，是另一条能力线。
#   样本不覆盖它，命中率就会系统性高估。
#
#   扩容后的实测证明这个担心是真的（2026-10-18）：
#     直接事实 14/14、跨段组合 8/8、**口语改写 7/12**、语料外 6/6。
#   掉的点不是"系统变差了"，是"以前没测到"。
#
#   ⚠️ 所以引用命中率必须带 type 切片 —— 只说总数会掩盖失败集中在哪里。
#
# type 四个值（每次扩样本都要先想清楚这条属于哪类）：
#   direct       直接事实 —— 信息词齐全的书面问法，考"能不能找到"
#   colloquial   口语改写 —— 真实用户会怎么说，考"换个说法还找不找得到"
#   multi_hop    跨段组合 —— 答案分散在多个小节/附录，考"排序能不能把该看的顶上来"
#   out_of_scope 语料外   —— 库里没有，考"会不会硬凑一条"
#
# ⚠️ 两级判据
#   expect_doc     文档级 —— 该命中哪一篇（必填，positive 用）
#   expect_section 章节级 —— 该命中哪一节（可选，填了就测）
#
# ⭐ 为什么要加章节级：文档级判据会**静默掩盖**"文档对、章节错"。
#   实测：「高血压怎么吃」top-3 召回的三条 title 全是《成人高血压食养指南》，
#   文档级全绿，但三条分别是「疾病特点与分型」「前言」「冲任失调证」——
#   一条"怎么吃"都没有，模型只能拿训练记忆编（回答里"约一啤酒瓶盖"语料 0 命中）。
#
# ⚠️ expect_section 用**关键词子串**（如「食养原则」）而不是完整标题
#   完整标题是「三、食养原则和建议」，序号和措辞会随 PDF 版本变。
#
# 文档标题 = 「权威文件/」里 PDF 的文件名（去掉 .pdf），一个字都不能差。
#
# ⚠️ 已入库的只有 9 份（2026-10-18 核对）：
#   中国居民膳食指南(2022) / 儿童青少年生长迟缓 / 儿童青少年肥胖 / 成人慢性肾脏病 /
#   成人糖尿病 / 成人肥胖 / 成人骨质疏松症（2026年版） / 成人高尿酸血症与痛风 / 成人高血压。
#   权威文件/ 里另有 5 份 PDF 索引里 0 块（肌少症2026、脑卒中2026、高脂血症2023 是独有内容，
#   糖尿病2023、骨质疏松2026 与已入库版本文件大小完全相同，属重复版本）。
#   → 这 3 份独有指南**不要**拿来做正样本，否则测的是语料缺失，不是检索能力。
#
# kind：
#   positive —— 该问题的答案就在库里，期望命中的文档出现在 top-k 里
#   negative —— 库里压根没有这类内容，期望**没有**有效召回
#
# ⚠️ known_defect 的用法：只在"确认语料里有答案、但检索没给到"时标。
#   标了会挂 xfail(strict=True)：缺陷还在则 XFAIL（套件仍绿），
#   修好后断言通过 → XPASS → strict 判失败 → 提醒回来摘标记。
#   若只是"期望标错了"，改 expect_*，**不要**标 known_defect。
# ======================================================================

