# rag_生成评测_cases.yaml
# ======================================================================
# RAG **生成侧**（Generation）样本 —— 测"模型有没有照着召回资料说"
#
# 与 kb_检索金标_cases.yaml 的分工（别搞混）：
#   那份测**检索**：该找到的找到没有。直连算法服务 5000，不需要 token。
#   这份测**生成**：找到之后有没有用、用得对不对。打 Java 后端 8080，要登录。
#
# ⭐ 每条样本在用例里会被**双查一次**：
#     ① 先调 5000 拿"这次应该依据什么"（召回集）
#     ② 再调 8080 拿"实际说了什么"（回答）
#   没有①，就没办法判断②里的引用是正确引用还是编造 —— 这是本文件存在的理由。
#
# 字段：
#   question       与 kb_检索金标_cases.yaml 同题（故意保留口语化问法）
#   expect_doc     期望召回命中的文档。仅作记录与自检；召回为空时用例直接 skip
#   key_quantities 回答里**若出现**这些数值，必须能在召回片段里找到（单位归一化后）
#                  ⚠️ 语料原文写「5g」，模型常写「5 克」——
#                     不做单位归一化，正确回答会被判成"数字不可追溯"（假红）
#   note           人话备注
# ======================================================================

- question: 高血压怎么吃
  expect_doc: 成人高血压食养指南
  key_quantities: ["5g"]
  note: 语料原文「每人每日食盐摄入量逐步降至 5g 以下」；回答常见写法是「5 克以下」

- question: 糖尿病怎么吃
  expect_doc: 成人糖尿病食养指南
  key_quantities: []
  note: 召回含「三、食养原则和建议」与「四、华东地区」食谱，section 跨章但 title 唯一 → 只跑引用判据
